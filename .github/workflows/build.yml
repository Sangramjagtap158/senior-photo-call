name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create standard Flutter folders if missing
        run: |
          if [ ! -d "android" ]; then
            mkdir -p /tmp/flutter_init
            flutter create /tmp/flutter_init --org com.example.seniorcall --project-name senior_photo_call
            cp -rn /tmp/flutter_init/* .
            cp -rn /tmp/flutter_init/.gitignore . 2>/dev/null || true
          fi

      - name: Restore your custom files
        run: |
          if [ -d "custom_app" ]; then
            cp custom_app/pubspec.yaml ./pubspec.yaml
            mkdir -p ./lib
            cp custom_app/main.dart ./lib/main.dart
          fi

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: senior-photo-call-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
