name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create clean Flutter project & apply custom files
        run: |
          flutter create /tmp/app --org com.example.seniorcall --project-name senior_photo_call
          if [ -f "custom_app/pubspec.yaml" ]; then
            cp custom_app/pubspec.yaml /tmp/app/pubspec.yaml
          fi
          if [ -f "custom_app/main.dart" ]; then
            mkdir -p /tmp/app/lib
            cp custom_app/main.dart /tmp/app/lib/main.dart
          fi
          python3 -c '
          p = "/tmp/app/android/build.gradle"
          with open(p, "r") as f:
              s = f.read()
          if "ext.kotlin_version" not in s:
              s = s.replace("buildscript {", "buildscript {\n    ext.kotlin_version = '\''1.9.24'\''", 1)
          with open(p, "w") as f:
              f.write(s)
          '
          cd /tmp/app
          flutter pub get
          flutter build apk --debug

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: senior-photo-call-apk
          path: /tmp/app/build/app/outputs/flutter-apk/app-debug.apk
