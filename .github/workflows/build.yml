name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create clean Flutter project & apply custom files
        run: |
          flutter create /tmp/app --org com.example.seniorcall --project-name senior_photo_call
          if [ -f "custom_app/pubspec.yaml" ]; then
            cp custom_app/pubspec.yaml /tmp/app/pubspec.yaml
          fi
          if [ -f "custom_app/main.dart" ]; then
            mkdir -p /tmp/app/lib
            cp custom_app/main.dart /tmp/app/lib/main.dart
          fi

          cat << 'EOF' > /tmp/patch_android.py
          import glob
          import re

          sg = "/tmp/app/android/settings.gradle"
          with open(sg, "r") as f:
              s = f.read()
          s = re.sub(
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.0.21\g<2>',
              s,
          )
          with open(sg, "w") as f:
              f.write(s)

          bg = "/tmp/app/android/build.gradle"
          with open(bg, "r") as f:
              b = f.read()
          b = re.sub(
              r'(ext\.kotlin_version\s*=\s*["\'])[^"\']+(["\'])',
              r'\g<1>2.0.21\g<2>',
              b,
          )
          with open(bg, "w") as f:
              f.write(b)

          m = "/tmp/app/android/app/src/main/AndroidManifest.xml"
          with open(m, "r") as f:
              txt = f.read()
          perm = '<uses-permission android:name="android.permission.CALL_PHONE"/>\n    '
          if "CALL_PHONE" not in txt:
              txt = txt.replace("<application", perm + "<application", 1)
          with open(m, "w") as f:
              f.write(txt)

          kt_files = glob.glob("/tmp/app/android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          if kt_files:
              kt_path = kt_files[0]
              with open(kt_path, "r") as f:
                  src = f.read()
              pkg_match = re.search(r'^\s*package\s+([^\s;]+)', src, re.M)
              pkg = pkg_match.group(1) if pkg_match else "com.example.seniorcall"
              new_kt = (
                  f"package {pkg}\n\n"
                  "import android.content.Intent\n"
                  "import android.net.Uri\n"
                  "import io.flutter.embedding.android.FlutterActivity\n"
                  "import io.flutter.embedding.engine.FlutterEngine\n"
                  "import io.flutter.plugin.common.MethodChannel\n\n"
                  "class MainActivity : FlutterActivity() {\n"
                  '    private val CHANNEL = "com.example.seniorcall/direct_call"\n\n'
                  "    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n"
                  "        super.configureFlutterEngine(flutterEngine)\n"
                  "        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->\n"
                  '            if (call.method == "makeDirectCall") {\n'
                  '                val phone = call.argument<String>("phone")?.trim() ?: ""\n'
                  "                if (phone.isEmpty()) {\n"
                  '                    result.error("INVALID_NUMBER", "Phone number is empty", null)\n'
                  "                    return@setMethodCallHandler\n"
                  "                }\n"
                  "                try {\n"
                  "                    val intent = Intent(Intent.ACTION_CALL).apply {\n"
                  '                        data = Uri.parse("tel:$phone")\n'
                  "                    }\n"
                  "                    startActivity(intent)\n"
                  "                    result.success(true)\n"
                  "                } catch (e: Exception) {\n"
                  '                    result.error("CALL_FAILED", e.message, null)\n'
                  "                }\n"
                  "            } else {\n"
                  "                result.notImplemented()\n"
                  "            }\n"
                  "        }\n"
                  "    }\n"
                  "}\n"
              )
              with open(kt_path, "w") as f:
                  f.write(new_kt)
          EOF

          python3 /tmp/patch_android.py
          cd /tmp/app
          flutter pub get
          flutter build apk --debug

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: senior-photo-call-apk
          path: /tmp/app/build/app/outputs/flutter-apk/app-debug.apk
